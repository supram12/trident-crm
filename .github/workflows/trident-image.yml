name: trident-image
on:
  push:
    tags: ['v*-trident.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node scripts/brand.mjs apply && node scripts/brand.mjs check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          build-args: APP_VERSION=2.9.0
          labels: |
            org.opencontainers.image.source=https://github.com/supram12/trident-crm
            org.opencontainers.image.description=Trident CRM (fork of Twenty, AGPLv3)
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/supram12/trident-crm:${{ github.ref_name }}
            ghcr.io/supram12/trident-crm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
